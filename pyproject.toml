[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdupe"
version = "1.0.0"
description = "Deteksi duplikat konten YouTube di level transkrip"
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.1.0",
    "webvtt-py>=0.5.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.1.0",
    "openpyxl>=3.1.0",
    "PySastrawi>=1.2.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.scripts]
ytdupe = "ytdupe.cli:cli"

[tool.setuptools.packages.find]
include = ["ytdupe*"]
