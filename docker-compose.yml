services:
  backend:
    build: .
    image: ytdupe-backend:local
    ports:
      - "8001:8001"
    environment:
      PORT: "8001"
      YTDUPE_DATA_DIR: /app/data
      YTDUPE_DB: /app/data/ytdupe.db
      YTDUPE_CORS_ORIGINS: "https://scrab.ekalliptus.com"
    volumes:
      - ytdupe-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/api/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  ytdupe-data:
